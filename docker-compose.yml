services:
  neo4j:
    image: neo4j:5
    container_name: memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/memoryengine2025
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: memory-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=knowledge_memory
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=memoryengine2025
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  pg_data:
